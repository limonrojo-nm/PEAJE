[project]
name = "peaje-core"
version = "0.1.0"
description = "Servidor de la instalación Peaje: gestiona clientes web y la cola de impresión térmica."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "redis>=5.0",
    "python-escpos[usb]>=3.1",
    "typer>=0.15",
    "jinja2>=3.1",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
peaje-core = "peaje_core.apis.cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
peaje_core = ["apis/http/templates/*.html"]
