[project]
name = "peaje-core"
version = "0.1.0"
description = "Servidor de la instalación Peaje: gestiona clientes web y la cola de impresión térmica."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "redis>=5.0",
]

[project.optional-dependencies]
printer = [
    "python-escpos>=3.1",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
